name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust-logging:
    name: Rust logging hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No print macros in app code
        run: scripts/check-rust-logging.sh

  node-tests:
    name: Node tests and worker types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: yarn
      # No install scripts: nothing here needs native builds.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn test
      - run: yarn typecheck:worker
